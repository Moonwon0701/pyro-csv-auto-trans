appId: com.pyro.csvorganizer
productName: FASEE Pyro CSV Organizer
copyright: Copyright © 2026
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
extraResources:
  - from: resources/tutorial-sample.csv
    to: tutorial-sample.csv
  - from: resources/label-templates
    to: label-templates
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: FASEE-PyroCSV-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: FASEE 불꽃쇼 CSV 자동 정리
mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.productivity
  identity: null
  artifactName: FASEE-PyroCSV-${version}-mac.${ext}
dmg:
  title: FASEE Pyro CSV Organizer
publish:
  provider: github
  owner: Moonwon0701
  repo: pyro-csv-auto-trans
  releaseType: release
